version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: postgres_db

    restart: always

    environment:
      POSTGRES_DB: result_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tope

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:

    build: .

    container_name: result_portal

    command: uv run python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres_data: